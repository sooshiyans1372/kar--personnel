```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه کارکرد پرسنل</title>

    <style>

        /* =========================================
           فونت‌های سامانه
        ========================================= */

        @font-face {
            font-family: "B Nazanin";
            src: local("B Nazanin");
            font-weight: normal;
        }

        @font-face {
            font-family: "B Nazanin";
            src: local("B Nazanin");
            font-weight: bold;
        }

        @font-face {
            font-family: "B Titr";
            src: local("B Titr");
            font-weight: normal;
        }


        /* =========================================
           تنظیمات عمومی
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            background: #f4f6f9;
            color: #263238;

            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 18px;

            direction: rtl;
        }

        button,
        input,
        select,
        textarea {
            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;
        }


        /* =========================================
           عنوان‌ها
        ========================================= */

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family:
                "B Titr",
                Tahoma,
                Arial,
                sans-serif;

            font-weight: normal;
        }


        /* =========================================
           هدر
        ========================================= */

        .header {
            background: #17365d;
            color: white;

            padding: 16px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, .12);
        }

        .header h1 {
            font-family:
                "B Titr",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 27px;
            font-weight: normal;
        }

        .header span {
            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 17px;
        }


        /* =========================================
           ساختار اصلی
        ========================================= */

        .layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }


        /* =========================================
           منوی کناری
        ========================================= */

        .sidebar {
            width: 245px;

            background: #ffffff;

            border-left: 1px solid #ddd;

            padding: 20px 12px;
        }

        .sidebar-title {
            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 17px;
            font-weight: bold;

            color: #777;

            padding: 10px 15px;
            margin-bottom: 8px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 5px;
        }

        .menu button {
            width: 100%;

            border: none;
            background: transparent;

            text-align: right;

            padding: 12px 15px;

            border-radius: 8px;

            cursor: pointer;

            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 18px;
            font-weight: bold;

            color: #37474f;

            transition: .2s;
        }

        .menu button:hover,
        .menu button.active {
            background: #eaf1f8;
            color: #17365d;
        }


        /* =========================================
           محتوای اصلی
        ========================================= */

        .content {
            flex: 1;
            padding: 30px;

            min-width: 0;
        }


        /* =========================================
           عنوان صفحه
        ========================================= */

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-family:
                "B Titr",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 29px;
            margin-bottom: 6px;
        }

        .page-title p {
            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            color: #777;
            font-size: 17px;
        }


        /* =========================================
           کارت‌های داشبورد
        ========================================= */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }

        .card {
            background: white;

            border-radius: 12px;

            padding: 22px;

            box-shadow:
                0 2px 10px rgba(0, 0, 0, .06);
        }

        .card-title {
            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            color: #777;

            font-size: 17px;
            font-weight: bold;

            margin-bottom: 10px;
        }

        .card-value {
            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 32px;
            font-weight: bold;

            color: #17365d;
        }

        .card-sub {
            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            margin-top: 8px;

            color: #888;

            font-size: 15px;
        }


        /* =========================================
           پنل
        ========================================= */

        .panel {
            background: white;

            border-radius: 12px;

            padding: 22px;

            box-shadow:
                0 2px 10px rgba(0, 0, 0, .06);

            margin-bottom: 22px;

            overflow-x: auto;
        }

        .panel h3 {
            font-family:
                "B Titr",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 22px;

            margin-bottom: 18px;
        }


        /* =========================================
           نوار ابزار
        ========================================= */

        .toolbar {
            display: flex;

            gap: 10px;

            align-items: center;

            margin-bottom: 18px;

            flex-wrap: wrap;
        }

        .search {
            flex: 1;

            min-width: 260px;

            padding: 10px 14px;

            border: 1px solid #d8d8d8;

            border-radius: 8px;

            outline: none;

            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 18px;

            background: white;
        }

        .search:focus {
            border-color: #17365d;

            box-shadow:
                0 0 0 2px rgba(23, 54, 93, .08);
        }


        /* =========================================
           دکمه‌ها
        ========================================= */

        .btn {
            border: none;

            border-radius: 8px;

            padding: 9px 17px;

            cursor: pointer;

            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 17px;
            font-weight: bold;

            transition: .2s;
        }

        .btn:hover {
            opacity: .88;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #17365d;
            color: white;
        }

        .btn-secondary {
            background: #eef2f6;
            color: #37474f;
        }

        .btn-danger {
            background: #c62828;
            color: white;
        }

        .btn-edit {
            background: #eaf1f8;
            color: #17365d;
        }


        /* =========================================
           شمارنده
        ========================================= */

        .count {
            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            color: #777;

            font-size: 16px;

            margin-bottom: 12px;
        }


        /* =========================================
           جدول
        ========================================= */

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 750px;
        }

        th {
            background: #f5f7fa;

            color: #555;

            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 18px;
            font-weight: bold;

            padding: 13px 10px;

            text-align: right;

            white-space: nowrap;
        }

        td {
            border-top: 1px solid #eee;

            padding: 12px 10px;

            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 17px;

            white-space: nowrap;
        }

        tbody tr:hover {
            background: #fafbfd;
        }


        /* =========================================
           وضعیت
        ========================================= */

        .status {
            display: inline-block;

            padding: 4px 12px;

            border-radius: 20px;

            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 15px;

            font-weight: bold;
        }

        .present {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .absent {
            background: #ffebee;
            color: #c62828;
        }


        /* =========================================
           عملیات
        ========================================= */

        .actions {
            display: flex;

            gap: 6px;

            align-items: center;
        }


        /* =========================================
           فرم
        ========================================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #555;

            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 17px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 10px;

            border:
                1px solid #ddd;

            border-radius: 7px;

            outline: none;

            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 17px;
        }

        .form-group input:focus {
            border-color: #17365d;
        }

        .form-actions {
            margin-top: 22px;

            display: flex;

            gap: 10px;

            justify-content: flex-start;
        }


        /* =========================================
           مودال
        ========================================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, .45);

            align-items: center;

            justify-content: center;

            z-index: 1000;

            padding: 15px;
        }

        .modal-box {
            background: white;

            width: 95%;

            max-width: 650px;

            max-height: 90vh;

            overflow-y: auto;

            border-radius: 14px;

            padding: 25px;
        }

        .modal-box h3 {
            font-family:
                "B Titr",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 24px;

            margin-bottom: 20px;
        }


        /* =========================================
           وضعیت اتصال
        ========================================= */

        #connectionStatus {
            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 17px;
        }


        /* =========================================
           حالت جدول خالی
        ========================================= */

        .empty {
            text-align: center;

            padding: 30px;

            color: #888;

            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 17px;
        }


        /* =========================================
           فوتر
        ========================================= */

        .footer {
            text-align: center;

            color: #999;

            font-family:
                "B Nazanin",
                Tahoma,
                Arial,
                sans-serif;

            font-size: 15px;

            padding: 20px;
        }


        /* =========================================
           واکنش‌گرا
        ========================================= */

        @media (max-width: 1100px) {

            .cards {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 900px) {

            .sidebar {
                width: 210px;
            }

            .content {
                padding: 20px;
            }

        }

        @media (max-width: 650px) {

            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 22px;
            }

            .header span {
                display: none;
            }

        }

    </style>

</head>


<body>
